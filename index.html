<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mereces Flores ❤️</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#08070a;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-family:Georgia,serif;
}

#inicio{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  opacity:1;
  transition:opacity .18s ease;
}

#titulo{
  margin:0;
  font-size:clamp(34px,9vw,58px);
  font-weight:normal;
  letter-spacing:.5px;
}

#subtitulo{
  margin:12px 0 30px;
  font-size:15px;
  opacity:.65;
}

#comenzar{
  appearance:none;
  border:1px solid rgba(255,255,255,.32);
  background:rgba(255,255,255,.07);
  color:#fff;
  padding:14px 30px;
  border-radius:28px;
  font-family:Georgia,serif;
  font-size:16px;
  cursor:pointer;
  touch-action:manipulation;
  transition:
    transform .1s ease,
    background .1s ease;
}

#comenzar:active{
  transform:scale(.96);
  background:rgba(255,255,255,.13);
}

#cargando{
  display:none;
  font-size:15px;
  opacity:.65;
}

#barra{
  width:130px;
  height:2px;
  margin-top:14px;
  overflow:hidden;
  background:rgba(255,255,255,.12);
  display:none;
}

#progreso{
  width:35%;
  height:100%;
  background:rgba(255,255,255,.7);
  animation:cargar .8s ease-in-out infinite alternate;
}

@keyframes cargar{
  from{
    transform:translateX(-110%);
  }
  to{
    transform:translateX(280%);
  }
}
</style>
</head>

<body>

<main id="inicio">

  <h1 id="titulo">Mereces Flores ❤️</h1>

  <p id="subtitulo">Un pequeño juego para ti.</p>

  <button id="comenzar" type="button">
    Comenzar
  </button>

  <div id="cargando">
    Preparando...
  </div>

  <div id="barra">
    <div id="progreso"></div>
  </div>

</main>

<script>
const inicio=document.getElementById('inicio');
const boton=document.getElementById('comenzar');
const cargando=document.getElementById('cargando');
const barra=document.getElementById('barra');

boton.addEventListener('click',()=>{

  boton.disabled=true;

  boton.style.display='none';
  document.getElementById('subtitulo').style.display='none';

  cargando.style.display='block';
  barra.style.display='block';

  /*
    Dejamos que el navegador pinte la pantalla
    antes de cambiar al juego.
  */

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      window.location.replace('juego.html');
    });
  });

});
</script>

</body>
  </html>
